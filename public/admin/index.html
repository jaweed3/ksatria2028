<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — KSATRIA 2028</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="page" id="pwPage">
  <div class="pw-box">
    <h1>KSATRIA 2028</h1>
    <p class="sub">Panel Admin</p>
    <input type="password" id="pwInput" placeholder="Password admin" autocomplete="current-password">
    <button class="btn" id="loginBtn">Masuk</button>
    <div class="e" id="pwErr">Password salah</div>
  </div>
</div>
<div class="page hidden" id="adminPage">
  <h1>KSATRIA 2028</h1>
  <p class="sub">Panel Admin &mdash; <span id="adminSub">Kelola Artikel Blog</span></p>
  <div class="toolbar">
    <span id="statusBadge" class="status">Belum terautentikasi</span>
    <button class="btn btn-s btn-o" onclick="logout()">Logout</button>
    <span style="flex:1"></span>
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchTab('post')" id="tabPost">Artikel</button>
      <button class="tab-btn" onclick="switchTab('event')" id="tabEvent">Acara</button>
      <button class="tab-btn" onclick="switchTab('galeri')" id="tabGaleri">Galeri</button>
      <button class="tab-btn" onclick="switchTab('quotes')" id="tabQuotes">Kutipan</button>
      <button class="tab-btn" onclick="switchTab('people')" id="tabPeople">Tokoh</button>
      <button class="tab-btn" onclick="switchTab('dokumen')" id="tabDokumen">Dokumen</button>
    </div>
    <span style="flex:1"></span>
    <button class="btn btn-s" id="newBtn" onclick="handleNew()">+ Baru</button>
    <button class="btn btn-s btn-o" id="refreshBtn" onclick="handleRefresh()">Refresh</button>
  </div>
  <div id="postSection">
    <div id="postList" class="post-list"></div>
    <div class="editor hidden" id="editPostForm">
      <label>Judul Artikel</label>
      <input type="text" id="postTitle" placeholder="Judul" maxlength="200">
      <label>Nama file <span class="hint">(huruf kecil, tanda hubung saja)</span></label>
      <input type="text" id="postSlug" placeholder="nama-file-artikel" maxlength="100" pattern="[a-z0-9-]+">
      <label>URL Thumbnail <span class="hint">(upload dulu di bawah)</span></label>
      <input type="text" id="postImage" placeholder="https://ksatria2028.com/uploads/nama.jpg" maxlength="500">
      <div class="row">
        <div><label>Kategori</label><select id="postCategory"><option value="">— Tanpa Kategori —</option><option value="Berita">Berita</option><option value="Opini">Opini</option><option value="Pengumuman">Pengumuman</option><option value="Liputan">Liputan</option><option value="Artikel">Artikel</option></select></div>
        <div><label>Tags <span class="hint">(koma)</span></label><input type="text" id="postTags" placeholder="berita, kongres, pemuda" maxlength="300"></div>
      </div>
      <label>Konten (Markdown)</label>
      <textarea id="postBody" placeholder="Tulis konten di sini..."></textarea>
      <div style="display:flex;gap:0.75rem;margin-top:0.5rem"><button class="btn" id="savePostBtn" onclick="savePost()">Simpan</button><button class="btn btn-o" onclick="cancelEdit()">Batal</button></div>
    </div>
  </div>
  <div id="eventSection" class="hidden">
    <div id="eventList" class="post-list"></div>
    <div class="editor hidden" id="editEventForm">
      <label>Judul Acara</label>
      <input type="text" id="eventTitle" placeholder="Judul" maxlength="200">
      <label>Nama file <span class="hint">(huruf kecil, tanda hubung saja)</span></label>
      <input type="text" id="eventSlug" placeholder="nama-acara" maxlength="100" pattern="[a-z0-9-]+">
      <div class="row">
        <div><label>Tanggal <span class="hint">(wajib)</span></label><input type="date" id="eventDate"></div>
        <div><label>Tipe Acara</label><select id="eventType"><option value="">— Pilih —</option><option value="sidang">Sidang</option><option value="festival">Festival</option><option value="konser">Konser</option><option value="workshop">Workshop</option><option value="other">Lainnya</option></select></div>
      </div>
      <div class="row">
        <div><label>Jam Mulai</label><input type="text" id="eventTimeStart" placeholder="09.00 WIB" maxlength="50"></div>
        <div><label>Jam Selesai</label><input type="text" id="eventTimeEnd" placeholder="17.00 WIB" maxlength="50"></div>
      </div>
      <label>Lokasi</label><input type="text" id="eventLocation" placeholder="Gedung MPR RI, Jakarta" maxlength="200">
      <div class="row">
        <div><label>URL Poster</label><input type="text" id="eventImage" placeholder="https://..." maxlength="500"></div>
        <div style="display:flex;align-items:flex-end;gap:0.5rem"><div style="flex:1"><label>&nbsp;</label><label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;text-transform:none;font-family:'Inter',sans-serif;color:rgba(245,240,232,0.6);cursor:pointer"><input type="checkbox" id="eventFeatured" style="width:auto;accent-color:#C9A84C;margin:0"> Acara Unggulan</label></div></div>
      </div>
      <label>Tags <span class="hint">(koma)</span></label><input type="text" id="eventTags" placeholder="sidang, komisi, nasional" maxlength="300">
      <label>Deskripsi (Markdown)</label>
      <textarea id="eventBody" placeholder="Tulis deskripsi acara..."></textarea>
      <div style="display:flex;gap:0.75rem;margin-top:0.5rem"><button class="btn" id="saveEventBtn" onclick="saveEvent()">Simpan</button><button class="btn btn-o" onclick="cancelEdit()">Batal</button></div>
    </div>
  </div>
  <div id="galeriSection" class="hidden">
    <div id="galeriList" class="post-list"></div>
    <div class="editor hidden" id="editGaleriForm">
      <label>Judul Foto</label><input type="text" id="galeriTitle" placeholder="Judul" maxlength="200">
      <label>Nama file <span class="hint">(huruf kecil, tanda hubung)</span></label><input type="text" id="galeriSlug" placeholder="judul-foto" maxlength="100" pattern="[a-z0-9-]+">
      <div class="row">
        <div><label>Keterangan</label><textarea id="galeriCaption" placeholder="Keterangan foto..." style="min-height:60px"></textarea></div>
        <div><label>Kategori</label><input type="text" id="galeriCategory" placeholder="Pelantikan, Simposium" maxlength="100"></div>
      </div>
      <label>URL Gambar</label><input type="text" id="galeriImage" placeholder="https://ksatria2028.com/uploads/galeri/nama.jpg" maxlength="500">
      <div style="display:flex;gap:0.75rem;margin-top:0.5rem"><button class="btn" id="saveGaleriBtn" onclick="saveGaleri()">Simpan</button><button class="btn btn-o" onclick="cancelEdit()">Batal</button></div>
    </div>
  </div>
  <div id="peopleSection" class="hidden">
    <div id="peopleList" class="post-list"></div>
    <div class="editor hidden" id="editPeopleForm">
      <div class="row">
        <div><label>Nama *</label><input type="text" id="peopleName" placeholder="Nama lengkap" maxlength="200"></div>
        <div><label>Nama file <span class="hint">(huruf kecil, tanda hubung)</span></label><input type="text" id="peopleSlug" placeholder="nama-tokoh" maxlength="100" pattern="[a-z0-9-]+"></div>
      </div>
      <div class="row">
        <div><label>Jabatan / Role *</label><input type="text" id="peopleRole" placeholder="Ketua Nasional..." maxlength="200"></div>
        <div><label>Kategori</label><select id="peopleCategory"><option value="">— Pilih —</option><option value="dewan-pelindung">Dewan Pelindung Nasional</option><option value="dewan-penasehat">Dewan Penasehat Nasional</option><option value="steering">Steering Committee</option><option value="pengurus">Pengurus Harian</option><option value="komisi">Ketua Komisi</option><option value="tokoh">Tokoh Nasional</option></select></div>
      </div>
      <div class="row">
        <div><label>URL Foto</label><input type="text" id="peoplePhoto" placeholder="https://..." maxlength="500"></div>
        <div><label>Urutan</label><input type="number" id="peopleOrder" placeholder="0" min="0" max="999"></div>
      </div>
      <label>Bio Singkat</label><textarea id="peopleBio" placeholder="Profil singkat..." style="min-height:80px"></textarea>
      <div style="display:flex;gap:0.75rem;margin-top:0.5rem"><button class="btn" id="savePeopleBtn" onclick="savePeople()">Simpan</button><button class="btn btn-o" onclick="cancelEdit()">Batal</button></div>
    </div>
  </div>
  <div id="quotesSection" class="hidden">
    <div id="quotesList" class="post-list"></div>
    <div class="editor hidden" id="editQuotesForm">
      <div class="row">
        <div><label>Nama Tokoh *</label><input type="text" id="quotesName" placeholder="Nama" maxlength="200"></div>
        <div><label>Nama file <span class="hint">(huruf kecil, tanda hubung)</span></label><input type="text" id="quotesSlug" placeholder="nama-tokoh" maxlength="100" pattern="[a-z0-9-]+"></div>
      </div>
      <label>Kutipan *</label><textarea id="quotesQuote" placeholder="Teks kutipan..." style="min-height:80px"></textarea>
      <div class="row">
        <div><label>Jabatan</label><input type="text" id="quotesRole" placeholder="Pendiri HMI" maxlength="200"></div>
        <div><label>Urutan</label><input type="number" id="quotesOrder" placeholder="0" min="0" max="999"></div>
      </div>
      <label>URL Foto (opsional)</label><input type="text" id="quotesPhoto" placeholder="https://..." maxlength="500">
      <div style="display:flex;gap:0.75rem;margin-top:0.5rem"><button class="btn" id="saveQuotesBtn" onclick="saveQuotes()">Simpan</button><button class="btn btn-o" onclick="cancelEdit()">Batal</button></div>
    </div>
  </div>
  <div id="dokumenSection" class="hidden">
    <div id="dokumenList" class="post-list"></div>
    <div class="editor hidden" id="editDokumenForm">
      <label>Judul Dokumen</label><input type="text" id="dokumenTitle" placeholder="Judul" maxlength="200">
      <label>Nama file <span class="hint">(huruf kecil, tanda hubung)</span></label><input type="text" id="dokumenSlug" placeholder="judul-dokumen" maxlength="100" pattern="[a-z0-9-]+">
      <label>Kategori</label><input type="text" id="dokumenCategory" placeholder="Laporan, Brosur, Panduan" maxlength="100">
      <label>URL File (PDF)</label><input type="text" id="dokumenFile" placeholder="https://ksatria2028.com/uploads/dokumen/nama.pdf" maxlength="500">
      <label>Ukuran File <span class="hint">(opsional, contoh: 2.4 MB)</span></label><input type="text" id="dokumenFileSize" placeholder="2.4 MB" maxlength="50">
      <div style="display:flex;gap:0.75rem;margin-top:0.5rem"><button class="btn" id="saveDokumenBtn" onclick="saveDokumen()">Simpan</button><button class="btn btn-o" onclick="cancelEdit()">Batal</button></div>
    </div>
  <div id="uploadBlock" class="upload-block hidden">
    <label>Upload File <span class="hint">(max 5MB PNG/JPG/WebP; PDF max 15MB)</span></label>
    <div class="flex"><input type="file" id="uploadInput" class="upload-input" accept="image/png,image/jpeg,image/gif,image/webp,.pdf"><button class="btn btn-s" id="uploadBtn" onclick="handleUpload()">Upload</button></div>
    <div id="uploadResult" style="margin-top:0.5rem;display:none"><input type="text" id="uploadUrl" class="upload-url" readonly><div class="flex" style="margin-top:0.4rem"><button class="btn btn-s btn-o" onclick="copyUploadUrl()">Salin URL</button><button class="btn btn-s btn-o" onclick="setUploadField()">Set ke Form</button><button class="btn btn-s" id="insertBtn" onclick="insertUploadUrl()">Sisipkan</button></div></div>
  </div>
</div>
<script src="admin-utils.js"></script>
<script src="admin-posts.js"></script>
<script src="admin-events.js"></script>
<script src="admin-galeri.js"></script>
<script src="admin-people.js"></script>
<script src="admin-quotes.js"></script>
<script src="admin-dokumen.js"></script>
<script src="admin-upload.js"></script>
</body>
</html>
